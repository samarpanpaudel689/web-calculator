<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Web Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator" id="calculator">
            <div class="toolbar">
                <button type="button" class="tool-btn" id="mode-toggle">Scientific</button>
                <button type="button" class="tool-btn angle-btn hidden" id="angle-toggle">DEG</button>
            </div>
            <div class="display">
                <div class="previous-operand" id="previous-operand"></div>
                <div class="current-operand" id="current-operand">0</div>
            </div>
            <div class="buttons">
                <button class="btn btn-function" data-action="clear">AC</button>
                <button class="btn btn-function" data-action="delete">⌫</button>
                <button class="btn btn-function" data-action="percent">%</button>
                <button class="btn btn-operator" data-action="divide">÷</button>

                <button class="btn" data-number="7">7</button>
                <button class="btn" data-number="8">8</button>
                <button class="btn" data-number="9">9</button>
                <button class="btn btn-operator" data-action="multiply">×</button>

                <button class="btn" data-number="4">4</button>
                <button class="btn" data-number="5">5</button>
                <button class="btn" data-number="6">6</button>
                <button class="btn btn-operator" data-action="subtract">−</button>

                <button class="btn" data-number="1">1</button>
                <button class="btn" data-number="2">2</button>
                <button class="btn" data-number="3">3</button>
                <button class="btn btn-operator" data-action="add">+</button>

                <button class="btn" data-action="negate">±</button>
                <button class="btn" data-number="0">0</button>
                <button class="btn" data-number=".">.</button>
                <button class="btn btn-equals" data-action="calculate">=</button>

                <!-- Scientific (hidden until toggled) -->
                <button class="btn btn-sci" data-action="sin">sin</button>
                <button class="btn btn-sci" data-action="cos">cos</button>
                <button class="btn btn-sci" data-action="tan">tan</button>
                <button class="btn btn-sci btn-operator" data-action="pi">π</button>

                <button class="btn btn-sci" data-action="log">log</button>
                <button class="btn btn-sci" data-action="ln">ln</button>
                <button class="btn btn-sci" data-action="sqrt">√</button>
                <button class="btn btn-sci" data-action="cbrt">∛</button>

                <button class="btn btn-sci" data-action="square">x²</button>
                <button class="btn btn-sci" data-action="cube">x³</button>
                <button class="btn btn-sci btn-operator" data-action="power">xʸ</button>
                <button class="btn btn-sci" data-action="factorial">n!</button>

                <button class="btn btn-sci" data-action="abs">|x|</button>
                <button class="btn btn-sci" data-action="e">e</button>
                <button class="btn btn-sci btn-operator" data-action="mod">mod</button>
                <button class="btn btn-sci" data-action="reciprocal">1/x</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
